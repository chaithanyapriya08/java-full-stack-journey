<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            background-image: url("https://images.unsplash.com/photo-1543722530-d2c3201371e7?q=80&w=1174&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D");
             background-repeat:no-repeat ;
            background-size: cover;
           background-position: center;
            background-attachment: fixed; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            
        }
        .box{
           perspective: 1500px;
        }
        .cube{
            height: 300px;
            width:300px;
            transform-style: preserve-3d;
            position: relative;
            animation: rotateCube 6s linear infinite;
          
        }
        .front,
        .back,
        .left,
        .right,
        .top,
        .bottom {
            position: absolute;
            width: 300px;
            height: 300px;
            border: 2px solid white;
            box-sizing: border-box;
            overflow: hidden;
        }
             .front img,
            .back img,
            .left img,
            .right img,
            .top img,
            .bottom img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }
        
        @keyframes rotateCube{
            from{
                transform: rotateX(0deg) rotateY(0deg);
            }
            to{
                transform: rotateX(360deg) rotateY(360deg);
            }
        }

        .front{
             background-color: red;
             transform:  translateZ(150px);    
             
        }
        .back{
            background-color:gold ;
            transform: rotateY(180deg) translateZ(150px);
             
        }
        .left{
            background-color: green;
            transform: rotateY(-90deg) translateZ(150px);
             
        }
        .right{
            background-color: blue;
            transform: rotateY(90deg) translateZ(150px);
             
        }
        .top{
            background-color: pink;
            transform: rotateX(90deg) translateZ(150px);
             
        }
        .bottom{
            background-color: magenta;
            transform: rotateX(-90deg) translateZ(150px);
             
        }
        
    </style>
</head>
<body>
    <div class="box">
    <div class="cube">
    <div class="front"><img src="https://plus.unsplash.com/premium_photo-1713163890188-6807aa2641de?q=80&w=764&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="earth"></div>
    <div class="back"><img src="https://images.unsplash.com/photo-1614642264762-d0a3b8bf3700?q=80&w=880&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="sun"></div>
    <div class="left"><img src="https://images.unsplash.com/photo-1614728894747-a83421e2b9c9?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTh8fHNvbGFyJTIwc3lzdGVtfGVufDB8fDB8fHww" alt="moon"></div>
    <div class="right"><img src="https://images.unsplash.com/photo-1614732414444-096e5f1122d5?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NHx8c29sYXIlMjBzeXN0ZW18ZW58MHx8MHx8fDA%3D" alt="saturn"></div>
    <div class="top"><img src="https://plus.unsplash.com/premium_photo-1717598582951-61aa2c602801?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NXx8bWFyc3xlbnwwfHwwfHx8MA%3D%3D" alt="mars"></div>
    <div class="bottom"><img src="https://plus.unsplash.com/premium_photo-1719104087061-6f73947c4c43?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OXx8anVwaXRhciUyMHBsYW5ldHxlbnwwfHwwfHx8MA%3D%3D" alt="jupitar"></div>
    </div>
    </div>
</body>
</html>
