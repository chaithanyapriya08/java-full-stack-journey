<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form3</title>
  </head>
  <body>
    <table border="1" cellpadding="50" cellspacing="40">
      <tr>
        <td bgcolor="#B6D0E2">
          <form>
            <table border="1" bgcolor="#D0D0D0">
              <center><h1>Login Form</h1></center>
              <tr>
                <td>
                  <label><b>Username:</b></label>
                  <input type="text" name="Username" />
                </td>
              </tr>
              <tr>
                <td>
                  <label><b>Password:</b></label>
                  <input type="password" name="Username" />
                </td>
              </tr>
            </table>
            <input type="checkbox" name="Remember Me" /><b>Remember Me</b>
            <hr />
            <center>
              <input type="submit" value="Login" />
              <input type="submit" value="Reset" />
            </center>
          </form>
        </td>
        <td bgcolor="#B6D0E2">
          <form>
            <table border="1" bgcolor="#D0D0D0">
              <center><h1>Event Registration</h1></center>
              <img
                src="../assets/ballon.jpg"
                width="150"
                height="100"
                align="right"
              />
              <tr>
                <td>
                  <label><b>Name:</b></label>
                  <input type="text" name="Username" />
                </td>
              </tr>
              <tr>
                <td>
                  <label><b>Email:</b></label>
                  <input type="text" name="Email" />
                </td>
              </tr>
              <tr>
                <td height="80" valign="top">
                  <label><b>Select Event:</b></label>
                  <select name="Event">
                    <option value="Conference">Conference</option>
                    <option value="Workshop">Workshop</option>
                    <option value="Seminar">Seminar</option>
                  </select>
                </td>
              </tr>
            </table>
            <br /><br />
            <center>
              <input type="submit" value="Register" />
              <input type="submit" value="Cancel" />
            </center>
          </form>
        </td>
      </tr>
      <tr>
        <td bgcolor="#B6D0E2">
          <form>
            <center><h1>Survey Form</h1></center>
            <hr />
            <table border="1" bgcolor="#D0D0D0">
              <tr>
                <td>
                  <label><b>How satisfied are you?</b></label
                  ><br />
                  <input
                    type="radio"
                    value="Very Satisfied"
                    name="Satisfied"
                  />Very Satisfied
                  <input type="radio" value="Neutral" name="Satisfied" />Neutral
                  <input
                    type="radio"
                    value="Dissatisfied"
                    name="Satisfied"
                  />Dissatisfied
                </td>
              </tr>
              <tr>
                <td>
                  <label><b>Comments:</b></label
                  ><br />
                  <textarea rows="2" cols="20"></textarea>
                </td>
              </tr>
            </table>
            <hr />

            <center>
              <input type="submit" value="Submit" />
              <input type="submit" value="Clear" />
            </center>
          </form>
        </td>
        <td bgcolor="#B6D0E2">
          <form>
            <table border="1" bgcolor="#D0D0D0">
              <center><h1>Hotel Booking</h1></center>
              <hr />
              <img
                src="../assets/beach.jpg"
                alt="beach"
                width="400"
                height="200"
              />
              <br />
              <br />
              <tr>
                <td width="400">
                  <label><b>Username:</b></label>
                  <input type="text" name="Username" />
                </td>
              </tr>
              <tr>
                <td>
                  <label><b>Password:</b></label>
                  <input type="password" name="Username" />
                </td>
              </tr>
              <td>
                <label><b>Number of Guests:</b></label>
                <select>
                  <option value="" select></option>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                </select>
              </td>
            </table>
            <hr />
            <br />
            <center>
              <input type="submit" value="Book Now" />
              <input type="submit" value="Cancel" />
            </center>
          </form>
        </td>

        <td bgcolor="#B6D0E2">
          <form>
            <table border="1" bgcolor="#D0D0D0">
              <center><h1>JOB Application</h1></center>

              <tr>
                <td>
                  <label><b>Full Name:</b></label>
                  <input type="text" name="Username" />
                </td>
              </tr>
              <tr>
                <td>
                  <label><b>Position Applied</b></label>
                  <input type="text" name="Email" />
                </td>
              </tr>
            </table>
            <h3>Qualifications:</h3>
            <ol type="1">
              <li>Resume Upload</li>
              <li>Cover Letter</li>
              <li>Rferences</li>
            </ol>
            <hr />

            <center>
              <input type="submit" value="Apply" />
              <input type="submit" value="Reset" />
            </center>
          </form>
        </td>
      </tr>
    </table>
  </body>
</html>
